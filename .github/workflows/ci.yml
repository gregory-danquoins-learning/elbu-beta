name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: elbub
        run: ./mvnw test -B -q

      - name: Build JAR
        working-directory: elbub
        run: ./mvnw package -DskipTests -B -q

  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: elbuf/package-lock.json

      - name: Install dependencies
        working-directory: elbuf
        run: npm ci --quiet

      - name: Build Angular
        working-directory: elbuf
        run: npx ng build --configuration production

  docker:
    name: Docker — Compose Build
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]

    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker compose build --no-cache
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          DB_PASSWORD: ci_pass
          JWT_SECRET: ci_secret_for_tests_only_not_production
          MAIL_HOST: localhost
          MAIL_USERNAME: ci@elbu.test
          MAIL_PASSWORD: ci
